<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffd5e5 0%, #ffe5f0 50%, #fff0f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated hearts border at top */
        .hearts-border {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 40px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            animation: sway 3s ease-in-out infinite;
        }

        .hearts-border::before {
            content: '💗 💕 🤍 💗 💕 🤍 💗 💕 🤍 💗 💕 🤍 💗 💕 🤍 💗 💕 🤍 💗 💕 🤍';
            font-size: clamp(16px, 3vw, 24px);
            letter-spacing: 15px;
            opacity: 0.6;
        }

        @keyframes sway {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        /* Floating hearts decoration */
        .floating-heart {
            position: absolute;
            font-size: clamp(20px, 4vw, 40px);
            opacity: 0.5;
            animation: floatAround 15s ease-in-out infinite;
            pointer-events: none;
        }

        .heart-1 { top: 15%; right: 10%; animation-delay: 0s; }
        .heart-2 { bottom: 20%; left: 8%; animation-delay: 1s; }
        .heart-3 { top: 60%; right: 15%; animation-delay: 2s; }
        .heart-4 { top: 40%; left: 12%; animation-delay: 3s; }
        .heart-5 { top: 30%; left: 5%; animation-delay: 4s; font-size: clamp(25px, 5vw, 50px); }
        .heart-6 { bottom: 30%; right: 8%; animation-delay: 5s; font-size: clamp(18px, 4vw, 35px); }
        .heart-7 { top: 70%; left: 20%; animation-delay: 6s; }
        .heart-8 { top: 25%; right: 25%; animation-delay: 7s; font-size: clamp(22px, 4.5vw, 45px); }

        @keyframes floatAround {
            0%, 100% { 
                transform: translateY(0px) translateX(0px) rotate(0deg); 
            }
            25% { 
                transform: translateY(-30px) translateX(20px) rotate(10deg); 
            }
            50% { 
                transform: translateY(-15px) translateX(-20px) rotate(-5deg); 
            }
            75% { 
                transform: translateY(-40px) translateX(15px) rotate(8deg); 
            }
        }

        /* Flowing hearts across screen */
        .flowing-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .flow-heart {
            position: absolute;
            font-size: clamp(15px, 3vw, 30px);
            opacity: 0;
            animation: flowUp 8s linear infinite;
        }

        @keyframes flowUp {
            0% {
                bottom: -50px;
                opacity: 0;
                transform: translateX(0) rotate(0deg);
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                bottom: 110%;
                opacity: 0;
                transform: translateX(100px) rotate(360deg);
            }
        }

        /* Pink flowers decoration */
        .flower {
            position: absolute;
            font-size: clamp(60px, 12vw, 120px);
            opacity: 0.25;
        }

        .flower-1 {
            bottom: 50px;
            left: 30px;
        }

        .flower-2 {
            top: 100px;
            right: 40px;
            font-size: clamp(50px, 10vw, 100px);
        }

        .flower-3 {
            bottom: 100px;
            right: 60px;
            font-size: clamp(40px, 8vw, 80px);
        }

        /* Cute sparkles */
        .sparkle {
            position: absolute;
            font-size: clamp(20px, 4vw, 35px);
            opacity: 0.4;
            animation: sparkleAnim 2s ease-in-out infinite;
        }

        .sparkle-1 { top: 20%; left: 15%; animation-delay: 0s; }
        .sparkle-2 { bottom: 25%; right: 20%; animation-delay: 0.5s; }
        .sparkle-3 { top: 55%; right: 10%; animation-delay: 1s; }

        @keyframes sparkleAnim {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.3; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.6; }
        }

        /* Cupid arrows */
        .arrow {
            position: absolute;
            font-size: clamp(30px, 6vw, 50px);
            opacity: 0.3;
            transform: rotate(45deg);
        }

        .arrow-1 { top: 35%; left: 5%; }
        .arrow-2 { bottom: 40%; right: 8%; transform: rotate(-45deg); }

        /* Love text decoration */
        .love-text {
            position: absolute;
            bottom: 80px;
            right: 50px;
            font-family: 'Brush Script MT', cursive;
            font-size: clamp(40px, 8vw, 80px);
            color: #ff69b4;
            opacity: 0.5;
            font-weight: bold;
            transform: rotate(-5deg);
        }

        .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: clamp(30px, 5vw, 60px);
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
            position: relative;
            z-index: 10;
            border: 3px solid rgba(255, 182, 193, 0.5);
        }

        .image-container {
            width: clamp(150px, 40vw, 200px);
            height: clamp(150px, 40vw, 200px);
            margin: 0 auto 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            border: 4px solid white;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .please-text {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 {
            font-family: 'Brush Script MT', cursive;
            color: #ff1493;
            font-size: clamp(28px, 6vw, 48px);
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.3);
            line-height: 1.3;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: clamp(12px, 3vw, 18px) clamp(30px, 6vw, 50px);
            font-size: clamp(14px, 3.5vw, 20px);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .yes-btn {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.4);
        }

        .no-btn {
            background: linear-gradient(135deg, #ffe5f0, #ffd5e5);
            color: #ff1493;
            border: 2px solid #ff69b4;
        }

        .no-btn:hover {
            transform: scale(0.95);
            background: linear-gradient(135deg, #ffd5e5, #ffb6c1);
        }

        /* Celebration overlay */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 193, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .celebration-content {
            text-align: center;
            color: white;
            font-size: clamp(30px, 8vw, 60px);
            font-weight: bold;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .hearts-explosion {
            position: absolute;
            font-size: clamp(30px, 6vw, 50px);
            animation: explode 2s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.5);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            .love-text {
                bottom: 40px;
                right: 20px;
            }
            
            .flower-1 {
                bottom: 20px;
                left: 10px;
            }

            .flower-2 {
                top: 80px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="flowing-hearts" id="flowingHearts"></div>
    
    <div class="hearts-border"></div>
    
    <div class="floating-heart heart-1">💖</div>
    <div class="floating-heart heart-2">💗</div>
    <div class="floating-heart heart-3">💕</div>
    <div class="floating-heart heart-4">💝</div>
    <div class="floating-heart heart-5">💘</div>
    <div class="floating-heart heart-6">❤️</div>
    <div class="floating-heart heart-7">💓</div>
    <div class="floating-heart heart-8">💞</div>
    
    <div class="flower flower-1">🌸</div>
    <div class="flower flower-2">🌺</div>
    <div class="flower flower-3">🌷</div>
    
    <div class="sparkle sparkle-1">✨</div>
    <div class="sparkle sparkle-2">⭐</div>
    <div class="sparkle sparkle-3">💫</div>
    
    <div class="arrow arrow-1">💘</div>
    <div class="arrow arrow-2">💘</div>
    
    <div class="love-text">love</div>

    <div class="container">
        <div class="image-container">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23ffeef5'/%3E%3Cstop offset='100%25' style='stop-color:%23ffe0ec'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect fill='url(%23bg)' width='400' height='400'/%3E%3C!-- Bunny head --%3E%3Cellipse cx='200' cy='180' rx='90' ry='100' fill='%23fff5e6' stroke='%23ffb4d1' stroke-width='3'/%3E%3C!-- Left ear --%3E%3Cellipse cx='150' cy='80' rx='30' ry='70' fill='%23fff5e6' stroke='%23ffb4d1' stroke-width='3'/%3E%3Cellipse cx='150' cy='85' rx='15' ry='45' fill='%23ffd4e5'/%3E%3C!-- Right ear --%3E%3Cellipse cx='250' cy='80' rx='30' ry='70' fill='%23fff5e6' stroke='%23ffb4d1' stroke-width='3'/%3E%3Cellipse cx='250' cy='85' rx='15' ry='45' fill='%23ffd4e5'/%3E%3C!-- Left eye --%3E%3Ccircle cx='170' cy='170' r='12' fill='%23333'/%3E%3Ccircle cx='174' cy='166' r='5' fill='white'/%3E%3C!-- Right eye --%3E%3Ccircle cx='230' cy='170' r='12' fill='%23333'/%3E%3Ccircle cx='234' cy='166' r='5' fill='white'/%3E%3C!-- Nose --%3E%3Cellipse cx='200' cy='200' rx='8' ry='12' fill='%23ffb4d1'/%3E%3C!-- Mouth --%3E%3Cpath d='M 200 205 Q 190 215 185 210' stroke='%23ff91b8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cpath d='M 200 205 Q 210 215 215 210' stroke='%23ff91b8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C!-- Whiskers left --%3E%3Cline x1='140' y1='185' x2='100' y2='180' stroke='%23ddd' stroke-width='2'/%3E%3Cline x1='140' y1='195' x2='100' y2='200' stroke='%23ddd' stroke-width='2'/%3E%3C!-- Whiskers right --%3E%3Cline x1='260' y1='185' x2='300' y2='180' stroke='%23ddd' stroke-width='2'/%3E%3Cline x1='260' y1='195' x2='300' y2='200' stroke='%23ddd' stroke-width='2'/%3E%3C!-- Blush left --%3E%3Cellipse cx='150' cy='195' rx='20' ry='12' fill='%23ffb4d1' opacity='0.4'/%3E%3C!-- Blush right --%3E%3Cellipse cx='250' cy='195' rx='20' ry='12' fill='%23ffb4d1' opacity='0.4'/%3E%3C!-- Hearts around --%3E%3Ctext x='80' y='120' font-size='30' fill='%23ff69b4' opacity='0.6'%3E💕%3C/text%3E%3Ctext x='300' y='140' font-size='25' fill='%23ff1493' opacity='0.6'%3E💗%3C/text%3E%3Ctext x='320' y='240' font-size='20' fill='%23ffb4d1' opacity='0.6'%3E💖%3C/text%3E%3C/svg%3E" alt="Cute Bunny">
            <div class="please-text">PLEASE...</div>
        </div>

        <h1>Ayushi, will you be my<br>Valentine? 💕</h1>

        <div class="buttons">
            <button class="yes-btn" onclick="sayYes()">Absolutely 💕</button>
            <button class="no-btn" onclick="sayNo()">Ummm...🤔</button>
        </div>
    </div>

    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <div>🎉 YAY! 🎉</div>
            <div style="font-size: 0.6em; margin-top: 20px;">We're Valentine's! 💖</div>
        </div>
    </div>

    <script>
        // Create flowing hearts
        function createFlowingHearts() {
            const container = document.getElementById('flowingHearts');
            const heartSymbols = ['💕', '💖', '💗', '💝', '💘', '❤️', '💓', '💞'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'flow-heart';
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
                heart.style.animationDelay = Math.random() * 2 + 's';
                
                container.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 10000);
            }, 800);
        }

        createFlowingHearts();

        function sayYes() {
            const celebration = document.getElementById('celebration');
            celebration.style.display = 'flex';
            
            // Create hearts explosion
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    createHeart();
                }, i * 100);
            }

            setTimeout(() => {
                celebration.style.display = 'none';
                // Navigate to gifts page after celebration
                window.location.href = 'gifts-page.html';
            }, 3000);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'hearts-explosion';
            heart.textContent = ['💕', '💖', '💗', '💝', '💘'][Math.floor(Math.random() * 5)];
            heart.style.left = '50%';
            heart.style.top = '50%';
            heart.style.setProperty('--tx', `${(Math.random() - 0.5) * 1000}px`);
            heart.style.setProperty('--ty', `${(Math.random() - 0.5) * 1000}px`);
            
            document.getElementById('celebration').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 2000);
        }

        function sayNo() {
            const responses = [
                "Are you sure? 🥺",
                "Maybe reconsider? 💭",
                "Pretty please? 🙏",
                "One more chance? 💝",
                "I'll be really nice! 🌟"
            ];
            alert(responses[Math.floor(Math.random() * responses.length)]);
        }
    </script>
</body>
</html>
